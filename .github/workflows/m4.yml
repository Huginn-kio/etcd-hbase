name: M4 Lease and Watch
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: m4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  maven-dependencies:
    uses: ./.github/workflows/maven-dependencies.yml
  j40:
    needs: maven-dependencies
    if: ${{ !cancelled() }}
    name: J40 Lease 管理与恢复
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: 确认依赖准备成功
        env:
          PREPARATION_RESULT: ${{ needs.maven-dependencies.result }}
        run: test "$PREPARATION_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 下载锁定的 Java 21
        run: python3 scripts/dev/download-locked-jdk.py --output "$RUNNER_TEMP/m4-jdk.tar.gz"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: jdkfile
          java-version: '21'
          jdk-file: ${{ runner.temp }}/m4-jdk.tar.gz
          cache: maven
          cache-read-only: true
          cache-dependency-path: |
            **/pom.xml
            .mvn/maven.config
            .mvn/wrapper/maven-wrapper.properties
            build/dependency-lock.json
            build/maven-settings-public.xml
            scripts/dev/mvn21.sh
            scripts/dev/maven-repository.sh
            scripts/dev/prepare-maven-dependencies.py
            .github/workflows/maven-dependencies.yml
      - name: 验证 J40
        env:
          ETCD_HBASE_JDK21_HOME: ${{ env.JAVA_HOME }}
        run: scripts/verify/m4.sh --scope public --task J40 --artifact-root ".artifacts/m4/ci-${{ github.run_id }}-${{ github.run_attempt }}"
  j41:
    needs: maven-dependencies
    if: ${{ !cancelled() }}
    name: J41 Lease 绑定与注册事务
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: 确认依赖准备成功
        env:
          PREPARATION_RESULT: ${{ needs.maven-dependencies.result }}
        run: test "$PREPARATION_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 下载锁定的 Java 21
        run: python3 scripts/dev/download-locked-jdk.py --output "$RUNNER_TEMP/m4-jdk.tar.gz"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: jdkfile
          java-version: '21'
          jdk-file: ${{ runner.temp }}/m4-jdk.tar.gz
          cache: maven
          cache-read-only: true
          cache-dependency-path: |
            **/pom.xml
            .mvn/maven.config
            .mvn/wrapper/maven-wrapper.properties
            build/dependency-lock.json
            build/maven-settings-public.xml
            scripts/dev/mvn21.sh
            scripts/dev/maven-repository.sh
            scripts/dev/prepare-maven-dependencies.py
            .github/workflows/maven-dependencies.yml
      - name: 验证 J41
        env:
          ETCD_HBASE_JDK21_HOME: ${{ env.JAVA_HOME }}
        run: scripts/verify/m4.sh --scope public --task J41 --artifact-root ".artifacts/m4/ci-${{ github.run_id }}-${{ github.run_attempt }}"
  j42:
    needs: maven-dependencies
    if: ${{ !cancelled() }}
    name: J42 KeepAlive 持久续约与跨副本接管
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: 确认依赖准备成功
        env:
          PREPARATION_RESULT: ${{ needs.maven-dependencies.result }}
        run: test "$PREPARATION_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 下载锁定的 Java 21
        run: python3 scripts/dev/download-locked-jdk.py --output "$RUNNER_TEMP/m4-jdk.tar.gz"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: jdkfile
          java-version: '21'
          jdk-file: ${{ runner.temp }}/m4-jdk.tar.gz
          cache: maven
          cache-read-only: true
          cache-dependency-path: |
            **/pom.xml
            .mvn/maven.config
            .mvn/wrapper/maven-wrapper.properties
            build/dependency-lock.json
            build/maven-settings-public.xml
            scripts/dev/mvn21.sh
            scripts/dev/maven-repository.sh
            scripts/dev/prepare-maven-dependencies.py
            .github/workflows/maven-dependencies.yml
      - name: 验证 J42
        env:
          ETCD_HBASE_JDK21_HOME: ${{ env.JAVA_HOME }}
        run: scripts/verify/m4.sh --scope public --task J42 --artifact-root ".artifacts/m4/ci-${{ github.run_id }}-${{ github.run_attempt }}"
  j43:
    needs: maven-dependencies
    if: ${{ !cancelled() }}
    name: J43 Lease 撤销与到期接管
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: 确认依赖准备成功
        env:
          PREPARATION_RESULT: ${{ needs.maven-dependencies.result }}
        run: test "$PREPARATION_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 下载锁定的 Java 21
        run: python3 scripts/dev/download-locked-jdk.py --output "$RUNNER_TEMP/m4-jdk.tar.gz"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: jdkfile
          java-version: '21'
          jdk-file: ${{ runner.temp }}/m4-jdk.tar.gz
          cache: maven
          cache-read-only: true
          cache-dependency-path: |
            **/pom.xml
            .mvn/maven.config
            .mvn/wrapper/maven-wrapper.properties
            build/dependency-lock.json
            build/maven-settings-public.xml
            scripts/dev/mvn21.sh
            scripts/dev/maven-repository.sh
            scripts/dev/prepare-maven-dependencies.py
            .github/workflows/maven-dependencies.yml
      - name: 验证 J43
        env:
          ETCD_HBASE_JDK21_HOME: ${{ env.JAVA_HOME }}
        run: scripts/verify/m4.sh --scope public --task J43 --artifact-root ".artifacts/m4/ci-${{ github.run_id }}-${{ github.run_attempt }}"
  j44:
    name: J44 已提交事件与共享 tailer
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 下载锁定的 Java 21
        run: python3 scripts/dev/download-locked-jdk.py --output "$RUNNER_TEMP/m4-jdk.tar.gz"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: jdkfile
          java-version: '21'
          jdk-file: ${{ runner.temp }}/m4-jdk.tar.gz
          cache: maven
      - name: 验证 J44
        env:
          ETCD_HBASE_JDK21_HOME: ${{ env.JAVA_HOME }}
        run: scripts/verify/m4.sh --scope public --task J44 --artifact-root ".artifacts/m4/ci-${{ github.run_id }}-${{ github.run_attempt }}"
