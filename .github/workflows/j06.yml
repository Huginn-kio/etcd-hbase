name: J06 runtime and request lifecycle

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: j06-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  java-go-smoke:
    name: 配置、请求生命周期与真实 HBase
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download the locked Temurin JDK
        run: python3 scripts/dev/download-locked-jdk.py --output "$RUNNER_TEMP/j06-temurin-jdk.tar.gz"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: jdkfile
          java-version: '21'
          jdk-file: ${{ runner.temp }}/j06-temurin-jdk.tar.gz
          cache: maven
      - name: 验证 J06 配置、取消、资源释放与互通
        run: ETCD_HBASE_JDK21_HOME="$JAVA_HOME" scripts/verify/j06.sh
