name: J04 HBase access baseline

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: j04-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  maven-dependencies:
    uses: ./.github/workflows/maven-dependencies.yml
  hbase-public-local:
    needs: maven-dependencies
    if: ${{ !cancelled() }}
    name: Java 21 and real temporary HBase
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 确认依赖准备成功
        env:
          PREPARATION_RESULT: ${{ needs.maven-dependencies.result }}
        run: test "$PREPARATION_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download the locked Temurin JDK
        run: python3 scripts/dev/download-locked-jdk.py --output "$RUNNER_TEMP/j04-temurin-jdk.tar.gz"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: jdkfile
          java-version: '21'
          jdk-file: ${{ runner.temp }}/j04-temurin-jdk.tar.gz
          cache: maven
          cache-read-only: true
          cache-dependency-path: |
            **/pom.xml
            .mvn/maven.config
            .mvn/wrapper/maven-wrapper.properties
            build/dependency-lock.json
            build/maven-settings-public.xml
            scripts/dev/mvn21.sh
            scripts/dev/maven-repository.sh
            scripts/dev/prepare-maven-dependencies.py
            .github/workflows/maven-dependencies.yml
      - name: Verify real HBase Kerberos, delegation token, custom DIGEST and ACL operations
        run: ETCD_HBASE_JDK21_HOME="$JAVA_HOME" scripts/verify/hbase-probe.sh --profile public-local
