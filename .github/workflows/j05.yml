name: J05 salt and initialization

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: j05-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  salt-and-initialization:
    name: Java 21 salt profiles and real HBase initialization
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download the locked Temurin JDK
        run: python3 scripts/dev/download-locked-jdk.py --output "$RUNNER_TEMP/j05-temurin-jdk.tar.gz"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: jdkfile
          java-version: '21'
          jdk-file: ${{ runner.temp }}/j05-temurin-jdk.tar.gz
          cache: maven
      - name: Verify salt vectors, confirmed initialization, recovery and real HBase identities
        run: ETCD_HBASE_JDK21_HOME="$JAVA_HOME" scripts/verify/j05.sh --scope public
