name: J07 native oracle and Go Java wire

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: j07-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  protocol-oracle:
    name: 原生 etcd、严格 trace 与 Go Java 互通
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download the locked Temurin JDK
        run: python3 scripts/dev/download-locked-jdk.py --output "$RUNNER_TEMP/j07-temurin-jdk.tar.gz"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: jdkfile
          java-version: '21'
          jdk-file: ${{ runner.temp }}/j07-temurin-jdk.tar.gz
          cache: maven
      - name: 验证 J07 公开协议工具链
        run: ETCD_HBASE_JDK21_HOME="$JAVA_HOME" scripts/verify/j07.sh
