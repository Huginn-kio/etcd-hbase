name: J10 byte and storage encoding contracts
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: j10-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  maven-dependencies:
    uses: ./.github/workflows/maven-dependencies.yml
  storage-encoding:
    needs: maven-dependencies
    if: ${{ !cancelled() }}
    name: 字节、行键与内部存储协议
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 确认依赖准备成功
        env:
          PREPARATION_RESULT: ${{ needs.maven-dependencies.result }}
        run: test "$PREPARATION_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 下载固定 Java 21
        run: python3 scripts/dev/download-locked-jdk.py --output "$RUNNER_TEMP/j10-jdk.tar.gz"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: jdkfile
          java-version: '21'
          jdk-file: ${{ runner.temp }}/j10-jdk.tar.gz
          cache: maven
          cache-read-only: true
          cache-dependency-path: |
            **/pom.xml
            .mvn/maven.config
            .mvn/wrapper/maven-wrapper.properties
            build/dependency-lock.json
            build/maven-settings-public.xml
            scripts/dev/mvn21.sh
            scripts/dev/maven-repository.sh
            scripts/dev/prepare-maven-dependencies.py
            .github/workflows/maven-dependencies.yml
      - name: 验证 J10 及相邻 HBase 契约
        run: ETCD_HBASE_JDK21_HOME="$JAVA_HOME" bash scripts/verify/j10.sh
