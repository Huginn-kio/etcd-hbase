name: J24 commit materialization and late-writer fencing
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: j24-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  materialization:
    name: J24 MiniCluster commit materialization
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 下载固定 Java 21
        run: python3 scripts/dev/download-locked-jdk.py --output "$RUNNER_TEMP/j24-jdk.tar.gz"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: jdkfile
          java-version: '21'
          jdk-file: ${{ runner.temp }}/j24-jdk.tar.gz
          cache: maven
      - name: 验证 J24 HISTORY 与 NATIVE MiniCluster 物化和 fencing
        run: ETCD_HBASE_JDK21_HOME="$JAVA_HOME" bash scripts/verify/j24.sh
