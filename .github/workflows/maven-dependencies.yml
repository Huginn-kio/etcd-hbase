name: Maven dependency preparation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  prepare:
    name: 准备 Maven 公共依赖
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 下载锁定的 Java 21
        run: python3 scripts/dev/download-locked-jdk.py --output "$RUNNER_TEMP/maven-jdk.tar.gz"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        id: java-cache
        with:
          distribution: jdkfile
          java-version: '21'
          jdk-file: ${{ runner.temp }}/maven-jdk.tar.gz
          cache: maven
          cache-dependency-path: |
            **/pom.xml
            .mvn/maven.config
            .mvn/wrapper/maven-wrapper.properties
            build/dependency-lock.json
            build/maven-settings-public.xml
            scripts/dev/mvn21.sh
            scripts/dev/maven-repository.sh
            scripts/dev/prepare-maven-dependencies.py
            .github/workflows/maven-dependencies.yml
      - name: 验证缓存门禁与实际下载退避
        env:
          ETCD_HBASE_JDK21_HOME: ${{ env.JAVA_HOME }}
        run: python3 scripts/verify/test_maven_resilience.py
      - name: 补全外部依赖与构建插件缓存
        if: steps.java-cache.outputs.cache-hit != 'true'
        env:
          ETCD_HBASE_JDK21_HOME: ${{ env.JAVA_HOME }}
        run: python3 scripts/dev/prepare-maven-dependencies.py
