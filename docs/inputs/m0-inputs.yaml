    request: Provide submission/read-barrier/renewal acceptance profile and KV/value/version/request/new-cluster scale; production numbers may be frozen in later stages.
  - ids: [B06]
    responsible_role: Security and platform maintainers
    request: Provide TLS, credential handoff, deployment/monitoring, backup/GC-window, and RPO/RTO requirements.
  - ids: [I07, I08]
    responsible_role: Project maintainers
    request: Decide license/source-notice policy and artifact coordinates/publication location.
